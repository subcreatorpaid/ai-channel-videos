name: Video (storyboard / thumbs / review / final)
run-name: "${{ inputs.mode }}: ${{ inputs.slug }}"

# One workflow for every render step of a long-form video (docs/pipeline.md). Run it from Actions > Run workflow, or Claude runs it
# with `gh workflow run video.yml -f slug=<slug> -f mode=<mode>` after the matching OK.
#   thumbs      OK 2  thumbnail concepts (1280x720 + phone-size check) -> committed to videos/<slug>/thumbs/
#   storyboard  OK 4  one still per scene + sheet.jpg (no voice)      -> committed to videos/<slug>/storyboard/
#   review      OK 5  640x360 review render with the Kokoro voice      -> Releases page, tag "previews" (private review, not posted)
#   final       after OK 5 only: 1920x1080 once (never 4K)            -> Releases page, tag "video-<slug>" with the thumbnails
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Folder name in videos/"
        required: true
      mode:
        description: "thumbs | storyboard | review | final"
        required: true
        default: storyboard
        type: choice
        options: [thumbs, storyboard, review, final]

permissions:
  contents: write

concurrency:
  group: video-${{ inputs.slug }}-${{ inputs.mode }}
  cancel-in-progress: true

env:
  SLUG: ${{ inputs.slug }}
  MODE: ${{ inputs.mode }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Check the folder
        run: test -f "videos/$SLUG/spec.json" || { echo "videos/$SLUG/spec.json not found"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt faster-whisper pyloudnorm
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: animator/package-lock.json
      - name: Headless Chrome libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Animator packages
        working-directory: animator
        run: npm ci --no-audit --no-fund

      # ---- OK 2 and OK 4: no voice needed
      - name: Thumbnails or storyboard
        if: inputs.mode == 'thumbs' || inputs.mode == 'storyboard'
        run: |
          if [ "$MODE" = thumbs ]; then python animator/storyboard.py "videos/$SLUG/spec.json" --thumbs
          else python animator/storyboard.py "videos/$SLUG/spec.json"; fi
          git config user.name "video[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "videos/$SLUG" && git commit -m "$MODE for $SLUG [skip ci]" && git push || echo "nothing new"

      # ---- OK 5 and final: voice + full render
      - uses: actions/cache@v4
        if: inputs.mode == 'review' || inputs.mode == 'final'
        with:
          path: |
            models
            ~/.cache/huggingface
          key: kokoro-v1.0-whisper-tiny-en
      - name: Voice model and word timing model
        if: inputs.mode == 'review' || inputs.mode == 'final'
        run: |
          python scripts/fetch_whisper.py
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s models/kokoro-v1.0.onnx ] || curl -fsSL -o models/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s models/voices-v1.0.bin ] || curl -fsSL -o models/voices-v1.0.bin "$base/voices-v1.0.bin"
      - name: Voice, music bed and word timings
        if: inputs.mode == 'review' || inputs.mode == 'final'
        run: python animator/prep.py "videos/$SLUG/spec.json"
      - name: Render
        if: inputs.mode == 'review' || inputs.mode == 'final'
        working-directory: animator
        run: |
          mkdir -p out
          if [ "$MODE" = review ]; then
            npx remotion render src/index.jsx Long out/raw.mp4 --props=props.json --scale=0.5 --codec=h264 --crf=20 --concurrency=100%
            npx remotion ffmpeg -loglevel error -y -i out/raw.mp4 -vf scale=640:360 -c:v libx264 -crf 23 -c:a aac -b:a 128k -movflags +faststart "out/${SLUG}_360p.mp4"
            rm out/raw.mp4
          else
            npx remotion render src/index.jsx Long "out/${SLUG}_1080p.mp4" --props=props.json --codec=h264 --crf=18 --concurrency=100%
          fi
      - name: Guard (final only)
        if: inputs.mode == 'final'
        run: python3 scripts/guard.py --strict
      - name: Publish on the Releases page (private review files, nothing is posted)
        if: inputs.mode == 'review' || inputs.mode == 'final'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = review ]; then tag=previews; title="360p reviews (not posted)"; else tag="video-$SLUG"; title="Final: $SLUG (upload after OK 6)"; fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$title" --notes "Private review files. Nothing is posted from here."
          files=(animator/out/*.mp4)
          [ "$MODE" = final ] && [ -d "videos/$SLUG/thumbs" ] && files+=(videos/$SLUG/thumbs/concept*.png)
          [ "$MODE" = final ] && [ -f "videos/$SLUG/upload.md" ] && files+=(videos/$SLUG/upload.md)
          gh release upload "$tag" "${files[@]}" --clobber
          echo "Done: https://github.com/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
